app-id: io.github.b1ngggg.CloudMusicPlayer
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cloudmusicplayer
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cloudmusicplayer/cargo
    CARGO_NET_OFFLINE: "true"
    CARGO_TARGET_DIR: /run/build/cloudmusicplayer/target

modules:
  - name: cloudmusicplayer
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://github.com/b1ngggg/CloudMusicPlayer.git
        tag: v1.0.3
      - cargo-sources.json
